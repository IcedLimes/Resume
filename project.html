<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason Zeng - Projects</title>
    <!-- Tailwind CSS compiled in the browser via CDN — no build step / npm needed. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";

      /* Brand blues, usable as Tailwind utilities: bg-brand, text-brand, border-brand, etc. */
      @theme {
        --color-brand: #2b6cb0;
        --color-brand-dark: #2c5282;
      }

      @layer base {
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
            Ubuntu, Cantarell, sans-serif;
          background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
          @apply flex min-h-screen flex-col text-slate-700 antialiased;
        }
      }

      @layer components {
        .site-header {
          @apply bg-gradient-to-br from-brand-dark to-brand px-8 py-12 text-center text-white shadow-md;
        }
        .site-header h1 {
          @apply text-4xl font-semibold tracking-tight sm:text-5xl;
        }

        .site-nav {
          @apply sticky top-0 z-50 flex flex-wrap justify-center bg-white shadow-sm;
        }
        .nav-link {
          @apply border-b-[3px] border-transparent px-7 py-5 font-medium text-slate-600 transition-all duration-300 hover:border-brand hover:bg-slate-50 hover:text-brand;
        }
        .nav-link.active {
          @apply border-brand text-brand;
        }

        .site-main {
          @apply mx-auto w-full max-w-[1200px] flex-1 px-4 py-16 sm:px-8;
        }

        .panel {
          @apply mb-8 rounded-xl bg-white p-8 shadow-md sm:p-12;
        }
        .panel h2 {
          @apply mb-6 text-3xl font-semibold text-brand-dark;
        }
        .panel p {
          @apply text-lg leading-relaxed text-slate-600;
        }
        .panel p + p {
          @apply mt-5;
        }

        .site-footer {
          @apply mt-auto bg-slate-800 px-8 py-8 text-center text-slate-300;
        }
      }

      @layer utilities {
        .animate-rise {
          animation: rise 0.6s ease both;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Projects page styling (DOM built at runtime by the script on that page). */
      .project-section {
        @apply mb-12 flex flex-wrap items-center gap-8 rounded-xl bg-white p-8 shadow-md sm:p-12;
      }
      .project-text {
        flex: 1 1 320px;
      }
      .project-text h2 {
        @apply mb-4 text-2xl font-semibold text-brand-dark;
      }
      .project-text p {
        @apply text-lg leading-relaxed text-slate-600;
      }
      .project-link {
        @apply font-semibold text-brand no-underline hover:underline;
      }
      .project-cards {
        flex: 1 1 500px;
        @apply flex justify-center;
      }

      .bounceCardsContainer {
        @apply relative flex items-center justify-center;
      }
      .card {
        position: absolute;
        width: 200px;
        aspect-ratio: 1;
        border: 5px solid #fff;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .card .image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>My Projects</h1>
    </header>
    <nav class="site-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about_me.html" class="nav-link">About Me</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="project.html" class="nav-link active">Projects</a>
        <a href="resume.html" class="nav-link">Resume</a>
    </nav>

    <main class="site-main" id="projects"></main>

    <footer class="site-footer">
        <p>&copy; 2024 Jason Zeng | jasonzeng2009@gmail.com</p>
    </footer>

    <!-- GSAP for the bounce animation (loaded from a CDN, no build needed). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
        // === Project data ===
        // Add an object here for each project. Swap the placeholder image
        // URLs in `images` for real screenshots whenever you have them.
        const projects = [
            {
                title: "ScreenSense — Smartboard Overlay",
                description: "A Python application that creates a transparent overlay interface, letting students annotate their screen with drawing tools (pen, highlighter, eraser) and use AI-powered features to solve math problems, generate similar practice questions, and translate text by boxing content and pressing hotkeys.",
                link: "https://github.com/ro-devnani/synthesis",
                images: [
                    "https://picsum.photos/seed/screensense1/400/400?grayscale",
                    "https://picsum.photos/seed/screensense2/400/400?grayscale",
                    "https://picsum.photos/seed/screensense3/400/400?grayscale",
                    "https://picsum.photos/seed/screensense4/400/400?grayscale",
                    "https://picsum.photos/seed/screensense5/400/400?grayscale"
                ]
            }
            // , { title: "...", description: "...", link: "...", images: [...] }
        ];

        // === BounceCards config (mirrors the React component's props) ===
        const transformStyles = [
            "rotate(10deg) translate(-170px)",
            "rotate(5deg) translate(-85px)",
            "rotate(-3deg)",
            "rotate(-10deg) translate(85px)",
            "rotate(2deg) translate(170px)"
        ];
        const containerWidth = 500;
        const containerHeight = 250;
        const animationDelay = 0.5;
        const animationStagger = 0.06;
        const easeType = "elastic.out(1, 0.8)";
        const enableHover = true;

        // --- transform helpers (ported from the React source) ---
        function getNoRotationTransform(transformStr) {
            const hasRotate = /rotate\([\s\S]*?\)/.test(transformStr);
            if (hasRotate) {
                return transformStr.replace(/rotate\([\s\S]*?\)/, "rotate(0deg)");
            } else if (transformStr === "none") {
                return "rotate(0deg)";
            }
            return `${transformStr} rotate(0deg)`;
        }
        function getPushedTransform(baseTransform, offsetX) {
            const translateRegex = /translate\(([-0-9.]+)px\)/;
            const match = baseTransform.match(translateRegex);
            if (match) {
                const newX = parseFloat(match[1]) + offsetX;
                return baseTransform.replace(translateRegex, `translate(${newX}px)`);
            }
            return baseTransform === "none"
                ? `translate(${offsetX}px)`
                : `${baseTransform} translate(${offsetX}px)`;
        }

        // Build one BounceCards container for a project's images.
        function createBounceCards(images) {
            const container = document.createElement("div");
            container.className = "bounceCardsContainer";
            container.style.width = containerWidth + "px";
            container.style.height = containerHeight + "px";

            images.forEach((src, idx) => {
                const card = document.createElement("div");
                card.className = `card card-${idx}`;
                card.style.transform = transformStyles[idx] ?? "none";

                const img = document.createElement("img");
                img.className = "image";
                img.src = src;
                img.alt = `card-${idx}`;
                card.appendChild(img);

                if (enableHover) {
                    card.addEventListener("mouseenter", () => pushSiblings(container, images, idx));
                    card.addEventListener("mouseleave", () => resetSiblings(container, images));
                }
                container.appendChild(card);
            });
            return container;
        }

        function pushSiblings(container, images, hoveredIdx) {
            images.forEach((_, i) => {
                const target = container.querySelector(`.card-${i}`);
                gsap.killTweensOf(target);
                const baseTransform = transformStyles[i] || "none";

                if (i === hoveredIdx) {
                    gsap.to(target, {
                        transform: getNoRotationTransform(baseTransform),
                        duration: 0.4,
                        ease: "back.out(1.4)",
                        overwrite: "auto"
                    });
                } else {
                    const offsetX = i < hoveredIdx ? -160 : 160;
                    gsap.to(target, {
                        transform: getPushedTransform(baseTransform, offsetX),
                        duration: 0.4,
                        ease: "back.out(1.4)",
                        delay: Math.abs(hoveredIdx - i) * 0.05,
                        overwrite: "auto"
                    });
                }
            });
        }

        function resetSiblings(container, images) {
            images.forEach((_, i) => {
                const target = container.querySelector(`.card-${i}`);
                gsap.killTweensOf(target);
                gsap.to(target, {
                    transform: transformStyles[i] || "none",
                    duration: 0.4,
                    ease: "back.out(1.4)",
                    overwrite: "auto"
                });
            });
        }

        // === Render every project with its own bouncing cards ===
        const root = document.getElementById("projects");
        projects.forEach((project) => {
            const section = document.createElement("div");
            section.className = "project-section";

            const text = document.createElement("div");
            text.className = "project-text";
            text.innerHTML = `
                <h2>${project.title}</h2>
                <p>${project.description}</p>
                ${project.link ? `<p style="margin-top: 1.25rem;"><a class="project-link" href="${project.link}" target="_blank" rel="noopener">View on GitHub &rarr;</a></p>` : ""}
            `;

            const cardsWrap = document.createElement("div");
            cardsWrap.className = "project-cards";
            cardsWrap.appendChild(createBounceCards(project.images));

            section.appendChild(text);
            section.appendChild(cardsWrap);
            root.appendChild(section);
        });

        // Bounce all cards in on load (scale 0 -> 1), staggered like the original.
        window.addEventListener("load", () => {
            gsap.fromTo(
                ".card",
                { scale: 0 },
                {
                    scale: 1,
                    stagger: animationStagger,
                    ease: easeType,
                    delay: animationDelay
                }
            );
        });
    </script>
</body>
</html>
